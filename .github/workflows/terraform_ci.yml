name: Terraform CI

# Verifica formatação e validade do código de infraestrutura.
# Não usa nenhum secret e não toca no banco: roda sem backend e sem credenciais.
on:
  pull_request:
    paths:
      - "terraform/**"
      - ".github/workflows/terraform_ci.yml"
  push:
    branches: [main]
    paths:
      - "terraform/**"
      - ".github/workflows/terraform_ci.yml"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: terraform
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Instalar Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: "1.15.8"

      - name: Formatação (terraform fmt)
        run: terraform fmt -check -recursive -diff

      - name: Inicializar sem backend e sem credenciais
        run: terraform init -backend=false -input=false

      - name: Validar configuração
        run: terraform validate
