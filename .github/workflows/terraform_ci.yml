name: Terraform CI

# Verifica formatação e validade do código de infraestrutura.
# Não usa nenhum secret e não toca no banco: roda sem backend e sem credenciais.
on:
  pull_request:
    paths:
      - "terraform/**"
      - ".github/workflows/terraform_ci.yml"
  push:
    branches: [main]
    paths:
      - "terraform/**"
      - ".github/workflows/terraform_ci.yml"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: terraform
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Instalar Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.15.8"

      - name: Formatação (terraform fmt)
        run: terraform fmt -check -recursive -diff

      - name: Inicializar sem backend e sem credenciais
        run: terraform init -backend=false -input=false

      - name: Validar configuração
        run: terraform validate
