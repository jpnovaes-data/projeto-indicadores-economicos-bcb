name: Terraform CI

# Verifica formatacao e validade do codigo de infraestrutura.
# Nao usa nenhum secret e nao toca no banco: roda sem backend e sem credenciais.
on:
  pull_request:
    paths:
      - "terraform/**"
      - ".github/workflows/terraform_ci.yml"
  push:
    branches: [main]
    paths:
      - "terraform/**"
      - ".github/workflows/terraform_ci.yml"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - name: Checkout do repositorio
        uses: actions/checkout@v4

      - name: Instalar Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.8"

      - name: Formatacao (terraform fmt)
        run: terraform fmt -check -recursive -diff

      - name: Inicializar sem backend e sem credenciais
        run: terraform init -backend=false -input=false

      - name: Validar configuracao
        run: terraform validate
