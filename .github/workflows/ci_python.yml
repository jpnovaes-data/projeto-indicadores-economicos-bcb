name: Python CI

# Qualidade do código e testes. Roda em TODO pull request (sem filtro de pasta),
# o que permite marcá-lo como check obrigatório na proteção da branch main.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  qualidade:
    name: lint e testes
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: economia_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Banco descartável do serviço acima; os testes se recusam a rodar em banco sem "test" no nome.
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/economia_test?sslmode=disable

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Configurar Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Instalar dependências
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: |
          ruff check .
          ruff format --check .

      - name: Testes unitários e de integração (Postgres + dbt)
        run: pytest
