name: Terraform Plan

# Plano somente leitura contra o state remoto. Nunca aplica mudanças.
# Roda só quando a infraestrutura muda (ou manualmente).
on:
  pull_request:
    paths:
      - "terraform/**"
      - ".github/workflows/terraform_plan.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  terraform-plan:
    name: Terraform Plan
    # Sem secrets para PRs do Dependabot nem de forks.
    if: >-
      github.actor != 'dependabot[bot]' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: terraform

    env:
      TF_TOKEN_app_terraform_io: ${{ secrets.TF_API_TOKEN }}
      NEON_API_KEY: ${{ secrets.NEON_API_KEY_CI }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: "1.15.8"
          terraform_wrapper: false

      - name: Terraform Format
        run: terraform fmt -check -recursive

      - name: Terraform Init
        run: terraform init -input=false

      - name: Terraform Validate
        run: terraform validate

      - name: Verificar acesso ao state (sem imprimir nada)
        run: terraform state list > /dev/null

      - name: Terraform Plan (somente resumo)
        run: |
          set +e
          terraform plan -input=false -lock=false -no-color -detailed-exitcode > plan.txt 2>&1
          code=$?
          set -e

          if [ "$code" -eq 0 ]; then
            echo "No changes. Infrastructure matches the configuration."
          elif [ "$code" -eq 2 ]; then
            grep -E "^Plan:" plan.txt || true
            echo "::warning::O plano propõe mudanças. Revise o diff completo localmente."
            if grep -E "^Plan:" plan.txt | grep -Eq " [1-9][0-9]* to destroy"; then
              echo "::error::O plano destrói recursos. Bloqueado."
              rm -f plan.txt
              exit 1
            fi
          else
            echo "::error::terraform plan falhou. Saída:"
            cat plan.txt
            rm -f plan.txt
            exit 1
          fi

          rm -f plan.txt
