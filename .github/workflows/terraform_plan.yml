name: Terraform Plan

# Plano somente leitura contra o state remoto. Nunca aplica mudancas.
#
# Roda em TODO pull request, de proposito: este check e obrigatorio na protecao da
# branch, e um workflow filtrado por pasta (paths:) nunca reporta status nos PRs que
# nao tocam em terraform/, deixando o PR preso em "Expected, waiting for status".
# A decisao "preciso planejar?" fica dentro do job: sem mudancas em terraform/, ele
# termina com sucesso em segundos e sem usar nenhum secret.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  terraform-plan:
    name: Terraform Plan
    # Dependabot nao recebe os secrets de infraestrutura (menor privilegio).
    # Um job pulado por condicao conta como aprovado na regra da branch.
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: terraform

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false
          fetch-depth: 2 # commit de merge do PR + commit base, para comparar

      - name: Detectar mudancas em terraform/
        id: mudancas
        working-directory: .
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            # HEAD e o merge do PR; HEAD^1 e a ponta da branch de destino.
            if git diff --name-only HEAD^1 HEAD | grep -Eq '^(terraform/|\.github/workflows/terraform_plan\.yml$)'; then
              echo "terraform=true" >> "$GITHUB_OUTPUT"
            else
              echo "terraform=false" >> "$GITHUB_OUTPUT"
              echo "Nenhuma mudanca em terraform/ neste PR: plano dispensado."
            fi
          else
            echo "terraform=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Terraform
        if: steps.mudancas.outputs.terraform == 'true'
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: "1.15.8"
          terraform_wrapper: false

      - name: Terraform Format
        if: steps.mudancas.outputs.terraform == 'true'
        run: terraform fmt -check -recursive

      - name: Terraform Init
        if: steps.mudancas.outputs.terraform == 'true'
        env:
          TF_TOKEN_app_terraform_io: ${{ secrets.TF_API_TOKEN }}
        run: terraform init -input=false

      - name: Terraform Validate
        if: steps.mudancas.outputs.terraform == 'true'
        run: terraform validate

      - name: Verificar acesso ao state (sem imprimir nada)
        if: steps.mudancas.outputs.terraform == 'true'
        env:
          TF_TOKEN_app_terraform_io: ${{ secrets.TF_API_TOKEN }}
          NEON_API_KEY: ${{ secrets.NEON_API_KEY_CI }}
        run: terraform state list > /dev/null

      - name: Terraform Plan (somente resumo)
        if: steps.mudancas.outputs.terraform == 'true'
        env:
          TF_TOKEN_app_terraform_io: ${{ secrets.TF_API_TOKEN }}
          NEON_API_KEY: ${{ secrets.NEON_API_KEY_CI }}
        run: |
          set +e
          terraform plan -input=false -lock=false -no-color -detailed-exitcode > plan.txt 2>&1
          code=$?
          set -e

          if [ "$code" -eq 0 ]; then
            echo "No changes. Infrastructure matches the configuration."
          elif [ "$code" -eq 2 ]; then
            grep -E "^Plan:" plan.txt || true
            echo "::warning::O plano propoe mudancas. Revise o diff completo localmente."
            if grep -E "^Plan:" plan.txt | grep -Eq " [1-9][0-9]* to destroy"; then
              echo "::error::O plano destroi recursos. Bloqueado."
              rm -f plan.txt
              exit 1
            fi
          else
            echo "::error::terraform plan falhou. Saida:"
            cat plan.txt
            rm -f plan.txt
            exit 1
          fi

          rm -f plan.txt