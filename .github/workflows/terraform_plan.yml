name: Terraform Plan

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  terraform-plan:
    name: Terraform Plan

    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: terraform

    env:
      TF_TOKEN_app_terraform_io: ${{ secrets.TF_API_TOKEN }}
      NEON_API_KEY: ${{ secrets.NEON_API_KEY_CI }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.8"
          terraform_wrapper: false

      - name: Terraform Format
        run: terraform fmt -check -recursive

      - name: Terraform Init
        run: terraform init -input=false

      - name: Terraform Validate
        run: terraform validate

      - name: Verificar acesso ao state (sem imprimir nada)
        run: terraform state list > /dev/null

      - name: Terraform Plan (somente resumo)
        run: |
          set +e
          terraform plan -input=false -lock=false -no-color -detailed-exitcode > plan.txt 2>&1
          code=$?
          set -e

          if [ "$code" -eq 0 ]; then
            echo "No changes. Infrastructure matches the configuration."
          elif [ "$code" -eq 2 ]; then
            grep -E "^Plan:" plan.txt || true
            echo "::warning::O plano propoe mudancas. Revise o diff completo localmente."
            if grep -E "^Plan:" plan.txt | grep -Eq " [1-9][0-9]* to destroy"; then
              echo "::error::O plano destroi recursos. Bloqueado."
              rm -f plan.txt
              exit 1
            fi
          else
            echo "::error::terraform plan falhou. Saida:"
            cat plan.txt
            rm -f plan.txt
            exit 1
          fi

          rm -f plan.txt