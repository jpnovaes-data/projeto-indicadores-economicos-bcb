name: pipeline diario de indicadores economicos

on:
  schedule:
    # Todo dia às 09:00 UTC (06:00 horário de Brasília)
    - cron: "0 9 * * *"
  workflow_dispatch: {}

# Permissão mínima no nível do workflow; cada job pede apenas o que precisa.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Único secret do banco: o profile do dbt é derivado dele (scripts/gerar_profile_dbt.py).
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configurar Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Ingestão - buscar séries do Banco Central
        run: python scripts/ingest_bcb.py

      - name: Validar dados brutos (aborta antes de tocar o banco)
        run: python scripts/validacao.py

      - name: Carga - upsert transacional no PostgreSQL
        run: python scripts/load_to_neon.py

      - name: Gerar profile do dbt a partir de DATABASE_URL
        run: python scripts/gerar_profile_dbt.py --target prod

      - name: dbt source freshness
        working-directory: dbt_economia
        run: dbt source freshness

      - name: dbt run - staging e marts
        working-directory: dbt_economia
        run: dbt run

      - name: dbt test - qualidade e regras de negócio
        working-directory: dbt_economia
        run: dbt test

      - name: Exportar dados do dashboard
        run: python scripts/export_dashboard_data.py

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Empacotar site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs

  deploy:
    needs: pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  notificar_falha:
    # Abre (ou comenta em) uma issue quando o pipeline ou o deploy falham.
    # O GitHub avisa por e-mail quem acompanha o repositório.
    needs: [pipeline, deploy]
    if: ${{ always() && (needs.pipeline.result == 'failure' || needs.deploy.result == 'failure') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      # Opcional: webhook compatível com Slack (secret ALERT_WEBHOOK_URL). Sem ele, só a issue.
      ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
    steps:
      - name: Registrar falha
        run: |
          set -euo pipefail
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          ABERTA=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
                     --label pipeline-falhou --json number --jq '.[0].number // empty')
          if [ -n "$ABERTA" ]; then
            gh issue comment "$ABERTA" --repo "$GITHUB_REPOSITORY" \
              --body "Nova falha em $(date -u +%d/%m/%Y) (UTC): $RUN_URL"
          else
            gh label create pipeline-falhou --repo "$GITHUB_REPOSITORY" --color B60205 \
              --description "Pipeline diário falhou" 2>/dev/null || true
            gh issue create --repo "$GITHUB_REPOSITORY" --label pipeline-falhou \
              --title "Pipeline diário falhou" \
              --body "O pipeline falhou. O dashboard continua publicado com os últimos dados válidos. Execução: $RUN_URL"
          fi
          if [ -n "${ALERT_WEBHOOK_URL:-}" ]; then
            curl -fsS -X POST -H 'Content-Type: application/json' \
              -d "{\"text\": \"Pipeline de indicadores falhou: $RUN_URL\"}" "$ALERT_WEBHOOK_URL" || true
          fi
