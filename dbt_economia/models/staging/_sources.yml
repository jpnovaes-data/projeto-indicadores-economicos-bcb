version: 2

sources:
  - name: raw
    schema: raw
    description: "Dados brutos da API SGS do Banco Central, carregados por scripts/load_to_neon.py."
    config:
      loaded_at_field: ingerido_em
      freshness:
        warn_after: {count: 30, period: hour}
        error_after: {count: 54, period: hour}
    tables:
      - name: cambio_dolar
        description: "Cotação diária do dólar comercial (venda), série SGS 1."
      - name: ipca
        description: "Variação mensal do IPCA (%), série SGS 433."
      - name: selic
        description: "Meta Selic (% ao ano), série SGS 432."
      - name: igpm
        description: "Variação mensal do IGP-M (%), série SGS 189."
