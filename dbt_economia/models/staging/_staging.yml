version: 2

models:
  - name: stg_cambio_dolar
    description: "Cotação diária do dólar (venda), sem nulos e ordenada."
    columns:
      - name: data
        data_tests:
          - unique
          - not_null
          - serie_diaria_sem_buracos:
              arguments: {max_dias: 7}  # só dias úteis; maior intervalo real: 5 dias
      - name: dolar_venda
        description: "R$ por US$."
        data_tests:
          - not_null
          - valor_na_faixa:
              arguments: {min_valor: 0.5, max_valor: 15}

  - name: stg_ipca
    description: "IPCA mensal, com acumulado composto de 12 meses (nulo até haver 12 meses consecutivos)."
    columns:
      - name: data
        data_tests: [unique, not_null, serie_mensal_continua]
      - name: ipca_variacao_mensal
        description: "Variação mensal (%)."
        data_tests:
          - not_null
          - valor_na_faixa:
              arguments: {min_valor: -5, max_valor: 10}
      - name: ipca_acumulado_12m
        description: "Acumulado composto de 12 meses (%)."
        data_tests:
          - valor_na_faixa:
              arguments: {min_valor: -5, max_valor: 40}

  - name: stg_selic
    description: "Meta Selic diária, sem nulos e ordenada."
    columns:
      - name: data
        data_tests:
          - unique
          - not_null
          - serie_diaria_sem_buracos:
              arguments: {max_dias: 1}  # publicada todo dia, sem exceção em 9,5 anos
      - name: meta_selic_aa
        description: "Meta Selic em % ao ano."
        data_tests:
          - not_null
          - valor_na_faixa:
              arguments: {min_valor: 0, max_valor: 60}

  - name: stg_igpm
    description: "IGP-M mensal, sem nulos e ordenado."
    columns:
      - name: data
        data_tests: [unique, not_null, serie_mensal_continua]
      - name: igpm_variacao_mensal
        description: "Variação mensal (%)."
        data_tests:
          - not_null
          - valor_na_faixa:
              arguments: {min_valor: -5, max_valor: 10}
