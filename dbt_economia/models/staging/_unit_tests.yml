version: 2

unit_tests:
  - name: ipca_acumulado_composto_com_12_meses_consecutivos
    description: "12 variações de 1,00% acumulam 12,6825% (composto), não 12% (soma simples)."
    model: stg_ipca
    given:
      - input: source('raw', 'ipca')
        rows:
          - {data: '2025-01-01', valor: 1.0}
          - {data: '2025-02-01', valor: 1.0}
          - {data: '2025-03-01', valor: 1.0}
          - {data: '2025-04-01', valor: 1.0}
          - {data: '2025-05-01', valor: 1.0}
          - {data: '2025-06-01', valor: 1.0}
          - {data: '2025-07-01', valor: 1.0}
          - {data: '2025-08-01', valor: 1.0}
          - {data: '2025-09-01', valor: 1.0}
          - {data: '2025-10-01', valor: 1.0}
          - {data: '2025-11-01', valor: 1.0}
          - {data: '2025-12-01', valor: 1.0}
          - {data: '2026-01-01', valor: 1.0}
    expect:
      rows:
        - {data: '2025-01-01', ipca_variacao_mensal: 1.0, ipca_acumulado_12m: null}
        - {data: '2025-02-01', ipca_variacao_mensal: 1.0, ipca_acumulado_12m: null}
        - {data: '2025-03-01', ipca_variacao_mensal: 1.0, ipca_acumulado_12m: null}
        - {data: '2025-04-01', ipca_variacao_mensal: 1.0, ipca_acumulado_12m: null}
        - {data: '2025-05-01', ipca_variacao_mensal: 1.0, ipca_acumulado_12m: null}
        - {data: '2025-06-01', ipca_variacao_mensal: 1.0, ipca_acumulado_12m: null}
        - {data: '2025-07-01', ipca_variacao_mensal: 1.0, ipca_acumulado_12m: null}
        - {data: '2025-08-01', ipca_variacao_mensal: 1.0, ipca_acumulado_12m: null}
        - {data: '2025-09-01', ipca_variacao_mensal: 1.0, ipca_acumulado_12m: null}
        - {data: '2025-10-01', ipca_variacao_mensal: 1.0, ipca_acumulado_12m: null}
        - {data: '2025-11-01', ipca_variacao_mensal: 1.0, ipca_acumulado_12m: null}
        - {data: '2025-12-01', ipca_variacao_mensal: 1.0, ipca_acumulado_12m: 12.6825}
        - {data: '2026-01-01', ipca_variacao_mensal: 1.0, ipca_acumulado_12m: 12.6825}

  - name: ipca_acumulado_nulo_quando_ha_buraco_na_serie
    description: "Se falta um mês, 12 linhas cobrem 13 meses e o acumulado de 12 meses não pode ser calculado."
    model: stg_ipca
    given:
      - input: source('raw', 'ipca')
        rows:
          - {data: '2025-01-01', valor: 0.5}
          - {data: '2025-02-01', valor: 0.5}
          - {data: '2025-03-01', valor: 0.5}
          - {data: '2025-04-01', valor: 0.5}
          - {data: '2025-05-01', valor: 0.5}
          - {data: '2025-07-01', valor: 0.5}
          - {data: '2025-08-01', valor: 0.5}
          - {data: '2025-09-01', valor: 0.5}
          - {data: '2025-10-01', valor: 0.5}
          - {data: '2025-11-01', valor: 0.5}
          - {data: '2025-12-01', valor: 0.5}
          - {data: '2026-01-01', valor: 0.5}
    expect:
      rows:
        - {data: '2025-01-01', ipca_variacao_mensal: 0.5, ipca_acumulado_12m: null}
        - {data: '2025-02-01', ipca_variacao_mensal: 0.5, ipca_acumulado_12m: null}
        - {data: '2025-03-01', ipca_variacao_mensal: 0.5, ipca_acumulado_12m: null}
        - {data: '2025-04-01', ipca_variacao_mensal: 0.5, ipca_acumulado_12m: null}
        - {data: '2025-05-01', ipca_variacao_mensal: 0.5, ipca_acumulado_12m: null}
        - {data: '2025-07-01', ipca_variacao_mensal: 0.5, ipca_acumulado_12m: null}
        - {data: '2025-08-01', ipca_variacao_mensal: 0.5, ipca_acumulado_12m: null}
        - {data: '2025-09-01', ipca_variacao_mensal: 0.5, ipca_acumulado_12m: null}
        - {data: '2025-10-01', ipca_variacao_mensal: 0.5, ipca_acumulado_12m: null}
        - {data: '2025-11-01', ipca_variacao_mensal: 0.5, ipca_acumulado_12m: null}
        - {data: '2025-12-01', ipca_variacao_mensal: 0.5, ipca_acumulado_12m: null}
        - {data: '2026-01-01', ipca_variacao_mensal: 0.5, ipca_acumulado_12m: null}

  - name: stg_selic_renomeia_e_descarta_nulos
    model: stg_selic
    given:
      - input: source('raw', 'selic')
        rows:
          - {data: '2026-01-01', valor: 15.0}
          - {data: '2026-01-02', valor: null}
    expect:
      rows:
        - {data: '2026-01-01', meta_selic_aa: 15.0}
